<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>순위 현황</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--ink:#16181d;--sub:#6b7280;--line:#e7e9ee;--soft:#f0f2f5;
  --up:#e5484d;--down:#2f6fed;--accent:#2f6fed;--good:#12a150;--warn:#d97706;
  --chip:#eef2fb;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0f1115;--card:#181b21;--ink:#eef0f3;--sub:#9aa1ad;--line:#262a32;--soft:#20242b;
  --up:#ff6b6f;--down:#6b9bff;--accent:#6b9bff;--chip:#1e2633;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 80px}
/* 잠금 */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lockbox{width:100%;max-width:340px;background:var(--card);border-radius:20px;padding:28px 22px;box-shadow:var(--shadow);text-align:center}
.lockbox h1{font-size:22px;margin:0 0 6px}.lockbox p{color:var(--sub);margin:0 0 20px;font-size:15px}
.pw{width:100%;font-size:28px;letter-spacing:12px;text-align:center;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--soft);outline:none}
.pw:focus{border-color:var(--accent)}
.btn{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:17px;font-weight:700;cursor:pointer}
.remember{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;color:var(--sub);font-size:15px}
.err{color:var(--up);min-height:22px;margin-top:10px;font-size:15px}
/* 상단 */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);padding:14px 16px 10px;margin:0 -16px}
.top{display:flex;align-items:center;gap:10px}
.top h1{font-size:24px;margin:0;font-weight:800}
.upd{color:var(--sub);font-size:13px;margin-left:auto}
.tabs{display:flex;background:var(--soft);border-radius:12px;padding:4px;margin-top:12px}
.tabs button{flex:1;border:0;background:none;padding:10px 0;border-radius:9px;font-weight:700;font-size:16px;color:var(--sub);cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.tabs .n{font-weight:600;color:var(--sub);font-size:14px;margin-left:4px}
/* 요약 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 4px}
.stat{background:var(--card);border-radius:14px;padding:12px 6px;text-align:center;box-shadow:var(--shadow);cursor:pointer;border:1.5px solid transparent}
.stat.on{border-color:var(--accent)}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1.1}
.stat span{font-size:13px;color:var(--sub)}
.stat.up b{color:var(--up)}.stat.down b{color:var(--down)}
/* 검색·정렬 */
.ctrl{display:flex;gap:8px;margin:12px 0}
.ctrl input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);outline:none;font-size:16px}
.ctrl input:focus{border-color:var(--accent)}
.ctrl select{padding:12px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:15px}
/* 목록 */
.group{margin-top:18px}
.gh{display:flex;align-items:center;justify-content:space-between;margin:0 4px 8px;font-weight:800;font-size:17px}
.gh small{color:var(--sub);font-weight:600;font-size:14px}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.card:active{transform:scale(.99)}
.kw{font-size:17px;font-weight:700;word-break:keep-all}
.meta{grid-column:1;color:var(--sub);font-size:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rk{grid-row:1/3;grid-column:2;text-align:right}
.rk b{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1}
.rk b small{font-size:16px;font-weight:700;margin-left:1px}
.rk .out{font-size:18px;color:var(--sub);font-weight:700}
.chg{display:inline-block;margin-top:6px;font-size:14px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--sub)}
.chg.up{color:var(--up);background:color-mix(in srgb,var(--up) 12%,transparent)}
.chg.down{color:var(--down);background:color-mix(in srgb,var(--down) 12%,transparent)}
.spark{grid-column:1/3;height:38px;width:100%;display:block;margin-top:2px}
.tag{font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--chip);color:var(--accent)}
.tag.top{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.tag.fail{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.empty{text-align:center;color:var(--sub);padding:40px 0}
/* 상세 */
#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;display:none}
#sheet.open{display:block}
.sh-top{position:sticky;top:0;background:var(--bg);padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);z-index:2}
.back{border:0;background:var(--soft);width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer;flex:none}
.sh-title{min-width:0}.sh-title b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-title span{color:var(--sub);font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.big{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.big b{font-size:44px;font-weight:800;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpi{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:20px}.kpi span{font-size:13px;color:var(--sub)}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;color:var(--sub);cursor:pointer}
.seg button.on{border-color:var(--accent);color:var(--accent)}
.chart{width:100%;display:block}
table{width:100%;border-collapse:collapse;font-size:15px}
th{color:var(--sub);font-weight:600;font-size:13px;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:11px 6px;border-bottom:1px solid var(--line)}
td.r{font-weight:800}
.runs{color:var(--sub);font-size:13px}
a.link{display:block;text-align:center;padding:14px;border-radius:14px;background:var(--chip);color:var(--accent);font-weight:700;text-decoration:none;margin:12px 0}
.foot{color:var(--sub);font-size:13px;text-align:center;margin-top:24px}
.addbtn{border:0;background:var(--chip);color:var(--accent);font-weight:700;font-size:14px;padding:7px 12px;border-radius:999px;cursor:pointer;font-family:inherit}
.fl{display:block;color:var(--sub);font-weight:700;font-size:14px;margin:14px 0 6px}
.fi{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:16px;font-family:inherit}
.fi:focus{outline:none;border-color:var(--accent)}
.kseg{display:flex;gap:8px}.kseg button{flex:1;padding:12px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-size:15px;font-weight:700;color:var(--sub);font-family:inherit}
.kseg button.on{border-color:var(--accent);color:var(--accent)}
.note{color:var(--sub);font-size:13px;line-height:1.6;margin-top:10px}
.ferr{color:var(--warn);font-weight:700;margin-top:10px;min-height:1em}
a.dellink{display:block;text-align:center;padding:12px;color:var(--warn);font-weight:700;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div id="lock">
  <form class="lockbox" id="lockform">
    <h1>순위 현황</h1>
    <p>비밀번호를 입력하세요</p>
    <input class="pw" id="pw" type="password" inputmode="numeric" autocomplete="current-password" autofocus>
    <label class="remember"><input type="checkbox" id="rem" checked> 이 기기에서 기억</label>
    <button class="btn" type="submit">열기</button>
    <div class="err" id="err"></div>
  </form>
</div>
<div id="app" hidden>
  <div class="wrap">
    <header>
      <div class="top"><h1>순위 현황</h1><span class="upd" id="upd"></span><button class="addbtn" id="runbtn">⟳ 조회</button><button class="addbtn" id="addbtn">＋ 추가</button></div>
      <div class="tabs" id="tabs"></div>
    </header>
    <div class="stats" id="stats"></div>
    <div class="ctrl">
      <input id="q" type="search" placeholder="키워드·업체 검색">
      <select id="sort">
        <option value="group">업체별</option>
        <option value="rank">순위 높은 순</option>
        <option value="up">많이 오른 순</option>
        <option value="down">많이 내린 순</option>
      </select>
    </div>
    <div id="list"></div>
    <div class="foot">광고 제외 · 위에서부터 몇 번째인지 · 빨강 ▲ 상승, 파랑 ▼ 하락<br><a href="#" id="logout" style="color:inherit">이 기기에서 잠그기</a></div>
  </div>
</div>
<div id="sheet"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const KEY = "rankview_pw";
let DATA, TAB = "place", FILTER = null;

async function decrypt(pw) {
  const p = JSON.parse($("#payload").textContent);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(p.salt), iterations: p.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(p.iv) }, key, b64(p.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function unlock(pw, remember) {
  try {
    DATA = await decrypt(pw);
  } catch { $("#err").textContent = "비밀번호가 맞지 않아요"; return false; }
  try { remember ? localStorage.setItem(KEY, pw) : localStorage.removeItem(KEY); } catch {}
  $("#lock").hidden = true; $("#lock").style.display = "none"; $("#app").hidden = false;
  init(); return true;
}
$("#lockform").onsubmit = (e) => { e.preventDefault(); unlock($("#pw").value.trim(), $("#rem").checked); };
$("#logout").onclick = (e) => { e.preventDefault(); try { localStorage.removeItem(KEY); } catch {} location.reload(); };
(async () => { let s = null; try { s = localStorage.getItem(KEY); } catch {} if (s) await unlock(s, true); })();

// ── 데이터 가공 ──
function enrich(it) {
  const h = it.hist.filter((r) => !r.err);
  const last = h[h.length - 1], prev = h[h.length - 2];
  it.now = last ? last.rank : null;
  it.lastDate = last ? last.d : null;
  it.lastAt = last ? last.at : null;
  it.fail = !!(it.hist.length && it.hist[it.hist.length - 1].err);
  it.delta = null;
  if (last && prev) {
    if (last.rank && prev.rank) it.delta = prev.rank - last.rank;
    else if (last.rank && !prev.rank) it.delta = "in";
    else if (!last.rank && prev.rank) it.delta = "out";
  }
  const rs = h.map((r) => r.rank).filter(Boolean);
  it.best = rs.length ? Math.min(...rs) : null;
  it.worst = rs.length ? Math.max(...rs) : null;
  it.total = last && last.total;
  return it;
}
function init() {
  DATA.items.forEach(enrich);
  $("#upd").textContent = DATA.updated.slice(5).replace("-", "/") + " 업데이트";
  renderTabs(); render();
  $("#q").oninput = render; $("#sort").onchange = render;
  if (DATA.repo) { $("#addbtn").onclick = openAdd; $("#runbtn").onclick = openRun; } else $("#addbtn").hidden = $("#runbtn").hidden = true;
}

// ── 추가·삭제 요청: 비공개 저장소에 요청 글을 남기면 PC가 몇 분 안에 반영 ──
function issueUrl(title, lines) {
  return `https://github.com/${DATA.repo}/issues/new?title=${encodeURIComponent("[순위체크] " + title)}&body=${encodeURIComponent(lines.join("\n"))}`;
}
function openRun() {
  history.pushState({ sheet: "run" }, "");
  const go = (k, n) => `<a class="link" href="${esc(issueUrl(`조회: ${n}`, [`종류: ${n}`]))}">${n}${k === "all" ? " (약 15분)" : k === "place" ? " (약 3분)" : " (약 10~15분)"}</a>`;
  $("#sheet").innerHTML = `
    <div class="sh-top"><button class="back" id="back">‹</button><div class="sh-title"><b>지금 조회 요청</b><span>PC가 2~3분 안에 조회를 시작해요</span></div></div>
    <div class="wrap"><div class="box">
      ${go("all", "전체")}${go("place", "플레이스")}${go("shop", "가격비교")}
      <div class="note">GitHub 화면이 열리면 <b>Create</b> 버튼만 누르면 끝이에요. 조회가 끝나면 이 페이지를 새로고침하세요.<br>한 항목만 보려면 그 항목을 눌러 맨 아래 "이 항목만 지금 조회"를 쓰세요.</div>
    </div></div>`;
  $("#back").onclick = () => history.back();
  $("#sheet").classList.add("open"); document.body.style.overflow = "hidden"; $("#sheet").scrollTop = 0;
}
let AKIND = "place";
function openAdd() {
  history.pushState({ sheet: "add" }, "");
  AKIND = TAB;
  drawAdd();
  $("#sheet").classList.add("open"); document.body.style.overflow = "hidden"; $("#sheet").scrollTop = 0;
}
function drawAdd() {
  const shop = AKIND === "shop";
  $("#sheet").innerHTML = `
    <div class="sh-top"><button class="back" id="back">‹</button><div class="sh-title"><b>추가 요청</b><span>PC가 몇 분 안에 목록에 넣고 바로 조회해요</span></div></div>
    <div class="wrap"><div class="box">
      <div class="kseg"><button data-k="place" class="${shop ? "" : "on"}">플레이스</button><button data-k="shop" class="${shop ? "on" : ""}">가격비교</button></div>
      <label class="fl" for="akw">키워드</label><input class="fi" id="akw" placeholder="${shop ? "예: 학원책상" : "예: 구월동미용실"}">
      <label class="fl" for="alink">링크</label><input class="fi" id="alink" placeholder="${shop ? "상품 링크 또는 상품번호" : "가게 링크 또는 가게번호"}">
      <label class="fl" for="aname">이름 (선택)</label><input class="fi" id="aname" placeholder="비워 두면 첫 조회 때 자동으로 채워요">
      <div class="note">${shop
        ? "링크: 네이버 쇼핑 검색 결과에서 상품을 <b>길게 눌러 링크 복사</b>한 주소, 가격비교 묶음 주소, 또는 상품번호."
        : "링크: 네이버 지도 앱에서 가게를 열고 <b>공유 → 링크 복사</b>한 주소."}</div>
      <div class="ferr" id="aerr"></div>
      <button class="btn" id="asend">요청 보내기 (GitHub)</button>
      <div class="note">GitHub 화면이 열리면 아래쪽 <b>Create</b>(또는 Submit new issue) 버튼만 누르면 끝이에요. GitHub에 로그인돼 있어야 해요.<br>결과는 몇 분 뒤 이 페이지를 새로고침하면 보여요.</div>
    </div></div>`;
  $("#back").onclick = () => history.back();
  $("#sheet").querySelectorAll(".kseg button").forEach((b) => b.onclick = () => { AKIND = b.dataset.k; drawAdd(); });
  $("#asend").onclick = () => {
    const kw = $("#akw").value.trim(), link = $("#alink").value.trim(), name = $("#aname").value.trim();
    if (!kw || !link) { $("#aerr").textContent = "키워드와 링크를 모두 넣어주세요"; return; }
    const kind = AKIND === "shop" ? "가격비교" : "플레이스";
    location.href = issueUrl(`추가: ${kw}`, [`종류: ${kind}`, `키워드: ${kw}`, `링크: ${link}`, `이름: ${name}`]);
  };
}
function renderTabs() {
  const c = (k) => DATA.items.filter((x) => x.kind === k).length;
  $("#tabs").innerHTML = [["place", "플레이스"], ["shop", "가격비교"]].map(([k, n]) =>
    `<button class="${TAB === k ? "on" : ""}" data-k="${k}">${n}<span class="n">${c(k)}</span></button>`).join("");
  $("#tabs").querySelectorAll("button").forEach((b) => b.onclick = () => { TAB = b.dataset.k; FILTER = null; renderTabs(); render(); });
}
const rankHtml = (r) => r ? `<b>${r}<small>위</small></b>` : `<span class="out">순위 밖</span>`;
function chgHtml(d) {
  if (d === null || d === undefined) return `<span class="chg">-</span>`;
  if (d === "in") return `<span class="chg up">신규 진입</span>`;
  if (d === "out") return `<span class="chg down">순위 이탈</span>`;
  if (d > 0) return `<span class="chg up">▲ ${d}</span>`;
  if (d < 0) return `<span class="chg down">▼ ${-d}</span>`;
  return `<span class="chg">변동 없음</span>`;
}
const num = (d) => typeof d === "number" ? d : d === "in" ? 999 : d === "out" ? -999 : 0;

function render() {
  const items = DATA.items.filter((x) => x.kind === TAB);
  const st = [
    ["top3", "1~3위", (x) => x.now && x.now <= 3],
    ["top10", "4~10위", (x) => x.now && x.now > 3 && x.now <= 10],
    ["up", "상승", (x) => num(x.delta) > 0],
    ["down", "하락", (x) => num(x.delta) < 0],
  ];
  $("#stats").innerHTML = st.map(([k, n, f]) =>
    `<div class="stat ${k} ${FILTER === k ? "on" : ""}" data-k="${k}"><b>${items.filter(f).length}</b><span>${n}</span></div>`).join("");
  $("#stats").querySelectorAll(".stat").forEach((s) => s.onclick = () => { FILTER = FILTER === s.dataset.k ? null : s.dataset.k; render(); });

  const q = $("#q").value.trim().toLowerCase();
  let list = items.filter((x) => !q || (x.kw + x.target + x.sub).toLowerCase().includes(q));
  if (FILTER) list = list.filter(st.find((s) => s[0] === FILTER)[2]);
  const sort = $("#sort").value;
  const rkv = (x) => x.now || 9999;
  if (sort === "rank") list.sort((a, b) => rkv(a) - rkv(b));
  if (sort === "up") list.sort((a, b) => num(b.delta) - num(a.delta));
  if (sort === "down") list.sort((a, b) => num(a.delta) - num(b.delta));
  if (!list.length) { $("#list").innerHTML = `<div class="empty">해당하는 항목이 없어요</div>`; return; }

  let groups;
  if (sort === "group") {
    const m = new Map();
    list.forEach((x) => { const g = x.sub || x.target; if (!m.has(g)) m.set(g, []); m.get(g).push(x); });
    groups = [...m.entries()].map(([g, xs]) => [g, xs.sort((a, b) => rkv(a) - rkv(b))]);
  } else groups = [["", list]];
  $("#list").innerHTML = groups.map(([g, xs]) =>
    `<div class="group">${g ? `<div class="gh"><span>${esc(g)}</span><small>${xs.length}개</small></div>` : ""}${xs.map(card).join("")}</div>`).join("");
  $("#list").querySelectorAll(".card").forEach((c) => c.onclick = () => openSheet(c.dataset.key));
}
function card(x) {
  const tags = [];
  if (x.now && x.now <= 3) tags.push(`<span class="tag top">TOP 3</span>`);
  if (x.fail) tags.push(`<span class="tag fail">최근 조회 실패</span>`);
  const meta = [];
  if (x.kind === "shop" || (x.sub && x.sub !== x.target)) meta.push(esc(x.kind === "shop" ? x.target.slice(0, 26) : x.target));
  if (x.total) meta.push(`${x.total.toLocaleString()}곳 중`);
  if (x.lastDate) meta.push(`${x.lastDate.slice(5).replace("-", "/")}${x.lastAt ? " " + x.lastAt : ""}`);
  return `<div class="card" data-key="${esc(x.key)}">
    <div class="kw">${esc(x.kw)}</div>
    <div class="rk">${x.hist.length ? rankHtml(x.now) + "<br>" + chgHtml(x.delta) : `<span class="out">조회 전</span>`}</div>
    <div class="meta">${tags.join("")}${meta.map((m) => `<span>${m}</span>`).join("·")}</div>
    ${spark(x.hist.filter((r) => !r.err).slice(-14))}
  </div>`;
}
function spark(h) {
  const W = 300, H = 38, P = 4;
  const rs = h.map((r) => r.rank);
  const v = rs.filter(Boolean);
  if (v.length < 2) return `<svg class="spark" viewBox="0 0 ${W} ${H}"></svg>`;
  const lo = Math.min(...v), hi = Math.max(...v), span = Math.max(hi - lo, 1);
  const X = (i) => P + (i * (W - 2 * P)) / Math.max(rs.length - 1, 1);
  const Y = (r) => P + ((r - lo) / span) * (H - 2 * P);
  let d = "", pen = false;
  rs.forEach((r, i) => { if (r) { d += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(r).toFixed(1); pen = true; } else pen = false; });
  const li = rs.length - 1;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>${rs[li] ? `<circle cx="${X(li)}" cy="${Y(rs[li])}" r="3.5" fill="var(--accent)"/>` : ""}</svg>`;
}

// ── 상세 화면 ──
let PERIOD = 30;
function openSheet(key) {
  const x = DATA.items.find((i) => i.key === key);
  history.pushState({ sheet: key }, "");
  drawSheet(x);
  $("#sheet").classList.add("open"); document.body.style.overflow = "hidden"; $("#sheet").scrollTop = 0;
}
function closeSheet() { $("#sheet").classList.remove("open"); document.body.style.overflow = ""; }
window.onpopstate = closeSheet;
function drawSheet(x) {
  const all = x.hist;
  const h = PERIOD ? all.slice(-PERIOD) : all;
  const ok = h.filter((r) => !r.err);
  const rs = ok.map((r) => r.rank).filter(Boolean);
  const avg = rs.length ? (rs.reduce((a, b) => a + b, 0) / rs.length).toFixed(1) : "-";
  const rows = [...h].reverse().map((r, i, arr) => {
    const nx = arr.slice(i + 1).find((z) => !z.err);
    let c = "";
    if (!r.err && nx) {
      if (r.rank && nx.rank) { const d = nx.rank - r.rank; c = d > 0 ? `<span style="color:var(--up)">▲${d}</span>` : d < 0 ? `<span style="color:var(--down)">▼${-d}</span>` : "-"; }
      else if (r.rank && !nx.rank) c = `<span style="color:var(--up)">진입</span>`;
      else if (!r.rank && nx.rank) c = `<span style="color:var(--down)">이탈</span>`;
    }
    const runs = (r.runs || []).length > 1 ? `<div class="runs">${r.runs.map((u) => `${u.at} ${u.rank ? u.rank + "위" : "밖"}`).join(" · ")}</div>` : "";
    const extra = [r.total ? `${r.total.toLocaleString()}곳` : "", r.reviews ? `리뷰 ${r.reviews.toLocaleString()}` : ""].filter(Boolean).join(" · ");
    return `<tr><td>${r.d.slice(5).replace("-", "/")} <span class="runs">${"일월화수목금토"[new Date(r.d).getDay()]}</span></td>
      <td class="r">${r.err ? `<span style="color:var(--warn)">실패</span>` : r.rank ? r.rank + "위" : `<span style="color:var(--sub)">밖</span>`}${runs}</td>
      <td>${c}</td><td class="runs">${r.at || (r.src === "adlog" ? "애드로그" : "")}${extra ? "<br>" + extra : ""}</td></tr>`;
  }).join("");
  $("#sheet").innerHTML = `
    <div class="sh-top"><button class="back" id="back">‹</button>
      <div class="sh-title"><b>${esc(x.kw)}</b><span>${esc(x.sub ? x.sub + " · " : "")}${esc(x.target)}</span></div></div>
    <div class="wrap">
      <div class="box"><div class="big"><div>${x.now ? `<b>${x.now}<small style="font-size:22px">위</small></b>` : `<b style="font-size:28px;color:var(--sub)">순위 밖</b>`}
        <div style="margin-top:8px">${chgHtml(x.delta)}</div></div>
        <div style="text-align:right;color:var(--sub);font-size:14px">${x.lastDate ? x.lastDate.replace(/-/g, ".") : ""}<br>${x.lastAt || ""}</div></div>
        <div class="kpis"><div class="kpi"><b>${rs.length ? Math.min(...rs) + "위" : "-"}</b><span>최고</span></div>
          <div class="kpi"><b>${avg === "-" ? "-" : avg + "위"}</b><span>평균</span></div>
          <div class="kpi"><b>${rs.length ? Math.max(...rs) + "위" : "-"}</b><span>최저</span></div></div></div>
      <div class="box"><div class="seg">${[[7, "7일"], [30, "30일"], [0, "전체"]].map(([p, n]) => `<button data-p="${p}" class="${PERIOD === p ? "on" : ""}">${n}</button>`).join("")}</div>
        ${bigChart(h)}</div>
      <div class="box" style="padding:6px 10px"><table><thead><tr><th>날짜</th><th>순위</th><th>변화</th><th>조회</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${x.url ? `<a class="link" href="${esc(x.url)}" target="_blank" rel="noopener">네이버에서 보기</a>` : ""}
      ${DATA.repo ? `<a class="link" href="${esc(issueUrl(`조회: ${x.kw}`, [`종류: ${x.kind === "shop" ? "가격비교" : "플레이스"}`, `항목: ${x.key}`]))}">이 항목만 지금 조회</a>` : ""}
      ${DATA.repo ? `<a class="dellink" href="${esc(issueUrl(`삭제: ${x.kw}`, [`종류: ${x.kind === "shop" ? "가격비교" : "플레이스"}`, `항목: ${x.key}`, `(지난 순위 기록은 남아요)`]))}">목록에서 삭제 요청</a>` : ""}
      <div class="foot">등록일 ${esc(x.since || "-")}</div>
    </div>`;
  $("#back").onclick = () => history.back();
  $("#sheet").querySelectorAll(".seg button").forEach((b) => b.onclick = () => { PERIOD = +b.dataset.p; drawSheet(x); });
}
function bigChart(h) {
  const W = 360, H = 200, L = 38, R = 12, T = 24, B = 26;
  const rs = h.map((r) => (r.err ? null : r.rank));
  const v = rs.filter(Boolean);
  if (!v.length) return `<div class="empty">이 기간엔 순위권 기록이 없어요</div>`;
  let lo = Math.min(...v), hi = Math.max(...v);
  if (hi - lo < 4) { hi = hi + 2; lo = Math.max(1, lo - 2); }
  const X = (i) => L + (i * (W - L - R)) / Math.max(rs.length - 1, 1);
  const Y = (r) => T + ((r - lo) / (hi - lo)) * (H - T - B);
  const ticks = [...new Set([lo, Math.round((lo + hi) / 2), hi])];
  let grid = ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${L - 8}" y="${Y(t) + 5}" text-anchor="end" font-size="12" fill="var(--sub)">${t}위</text>`).join("");
  const step = Math.ceil(rs.length / 5);
  const xl = h.map((r, i) => (i % step === 0 || i === rs.length - 1) ? `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--sub)">${r.d.slice(5).replace("-", "/")}</text>` : "").join("");
  let d = "", pen = false;
  rs.forEach((r, i) => { if (r) { d += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(r).toFixed(1); pen = true; } else pen = false; });
  const dots = rs.map((r, i) => r ? `<circle cx="${X(i)}" cy="${Y(r)}" r="${rs.length > 20 ? 2 : 3}" fill="var(--card)" stroke="var(--accent)" stroke-width="1.8"/>` : "").join("");
  const li = rs.map((r, i) => r ? i : -1).filter((i) => i >= 0).pop();
  const ly = Y(rs[li]) - 9 < 14 ? Y(rs[li]) + 20 : Y(rs[li]) - 9;
  const lab = `<text x="${X(li)}" y="${ly}" text-anchor="${li > rs.length * .8 ? "end" : "middle"}" font-size="14" font-weight="800" fill="var(--accent)">${rs[li]}위</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${grid}${xl}<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${dots}${lab}</svg>
    <div style="color:var(--sub);font-size:13px;text-align:center;margin-top:4px">위로 갈수록 상위 · 끊긴 구간은 순위 밖</div>`;
}
</script>
</body>
</html>
